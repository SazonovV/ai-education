<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>G · телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
@keyframes board-blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
</style>
</helmet>
<div style="width: 390px; min-height: 1600px; box-sizing: border-box; padding: 28px 16px; background: {{page.bg}}; font-family: Manrope, 'Segoe UI', sans-serif; display: flex; flex-direction: column; gap: 32px">

<section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 7px">
<h2 style="margin: 0; font: 700 12px/1 Manrope, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: {{page.label}}">Направления</h2>
<span style="font: 500 10px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 1.5px; color: {{page.label}}">ВЫХОД НА ПОСАДКУ · GATES</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{dest}}" as="d" hint-placeholder-count="3">
<a href="{{d.url}}" style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: 12px; background: #111111; color: #f5f1e8; box-shadow: 0 0 0 1px {{page.edge}}, 0 14px 28px -22px rgba(0, 0, 0, 0.55)">
<div style="display: flex; gap: 14px; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
<span style="font: 500 9px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 1.5px; color: #9d978b">ВЫХОД</span>
<span style="display: flex; gap: 2px">
<sc-for list="{{d.gateCells}}" as="c" hint-placeholder-count="2">
<span style="position: relative; display: inline-grid; place-items: center; width: 26px; height: 38px; border-radius: 4px; background: linear-gradient(#282828 0 50%, #1e1e1e 50% 100%); color: #ffc93c; font: 600 26px/1 'Fira Sans Condensed', 'PT Sans Narrow', sans-serif">{{c.ch}}<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, 0.65)"></span></span>
</sc-for>
</span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font: 500 11px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 1px; color: #9d978b">{{d.code}}</span>
<span style="font: 800 18px/1.25 Manrope, sans-serif; color: #f5f1e8">{{d.name}}</span>
<span style="font: 500 13px/1.35 Manrope, sans-serif; color: #a8a295">{{d.where}}</span>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid #262626">
<span style="display: flex; align-items: center; gap: 7px">
<sc-if value="{{d.blink}}" hint-placeholder-val="{{false}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; animation: board-blink 1.4s infinite"></span></sc-if>
<span style="display: flex; gap: 2px">
<sc-for list="{{d.statusCells}}" as="c" hint-placeholder-count="7">
<span style="position: relative; display: inline-grid; place-items: center; width: 16px; height: 25px; border-radius: 3px; background: linear-gradient(#282828 0 50%, #1e1e1e 50% 100%); color: #3ddc84; font: 600 16px/1 'Fira Sans Condensed', 'PT Sans Narrow', sans-serif">{{c.ch}}<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, 0.65)"></span></span>
</sc-for>
</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3ddc84" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
</div>
</a>
</sc-for>
</div>
</section>

<section style="background: #111111; color: #f5f1e8; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px {{page.edge}}, 0 18px 36px -24px rgba(0, 0, 0, 0.55)">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 14px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffc93c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 22h20"></path><path d="M6.36 17.4 4 17l-2-4 1.1-.55a2 2 0 0 1 1.8 0l.17.1a2 2 0 0 0 1.8 0L8 12 5 6l.9-.45a2 2 0 0 1 2.09.2l4.02 3a2 2 0 0 0 2.1.2l4.19-2.06a2.41 2.41 0 0 1 1.73-.17L21 7a1.4 1.4 0 0 1 .87 1.99l-.38.76c-.23.46-.6.84-1.07 1.08L7.58 17.2a2 2 0 0 1-1.22.18Z"></path></svg>
<div style="display: flex; flex-direction: column; gap: 3px">
<h2 style="margin: 0; font: 800 18px/1 Manrope, sans-serif; color: #f5f1e8">Выступления</h2>
<span style="font: 500 12px/1 Manrope, sans-serif; color: #9d978b">Departures</span>
</div>
</div>
<span style="display: flex; gap: 2px">
<sc-for list="{{clock}}" as="c" hint-placeholder-count="5">
<span style="position: relative; display: inline-grid; place-items: center; width: 15px; height: 24px; border-radius: 3px; background: linear-gradient(#282828 0 50%, #1e1e1e 50% 100%); color: #ffc93c; font: 600 15px/1 'Fira Sans Condensed', 'PT Sans Narrow', sans-serif">{{c.ch}}<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, 0.65)"></span></span>
</sc-for>
</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<li style="padding: 8px 14px; background: #0a0a0a; border-top: 1px solid #1f1f1f; font: 800 11px/1 Manrope, sans-serif; letter-spacing: 0.14em; color: #ffc93c">{{g.year}}</li>
<sc-for list="{{g.talks}}" as="t" hint-placeholder-count="3">
<li>
<a href="{{t.url}}" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; background: {{t.bg}}">
<span style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
<span style="display: flex; gap: 2px">
<sc-for list="{{t.dateCells}}" as="c" hint-placeholder-count="6">
<span style="position: relative; display: inline-grid; place-items: center; width: 14px; height: 23px; border-radius: 3px; background: linear-gradient(#282828 0 50%, #1e1e1e 50% 100%); color: #f5f1e8; font: 600 15px/1 'Fira Sans Condensed', 'PT Sans Narrow', sans-serif">{{c.ch}}<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, 0.65)"></span></span>
</sc-for>
</span>
<span style="display: flex; align-items: center; gap: 6px">
<sc-if value="{{t.blink}}" hint-placeholder-val="{{false}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.color}}; animation: board-blink 1.4s infinite"></span></sc-if>
<span style="display: flex; gap: 2px">
<sc-for list="{{t.statusCells}}" as="c" hint-placeholder-count="7">
<span style="position: relative; display: inline-grid; place-items: center; width: 14px; height: 23px; border-radius: 3px; background: linear-gradient(#282828 0 50%, #1e1e1e 50% 100%); color: {{t.color}}; font: 600 15px/1 'Fira Sans Condensed', 'PT Sans Narrow', sans-serif">{{c.ch}}<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, 0.65)"></span></span>
</sc-for>
</span>
</span>
</span>
<span style="display: flex; gap: 2px">
<sc-for list="{{t.destCells}}" as="c" hint-placeholder-count="20">
<span style="position: relative; display: inline-grid; place-items: center; width: 14px; height: 23px; border-radius: 3px; background: linear-gradient(#282828 0 50%, #1e1e1e 50% 100%); color: #f5f1e8; font: 600 15px/1 'Fira Sans Condensed', 'PT Sans Narrow', sans-serif">{{c.ch}}<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, 0.65)"></span></span>
</sc-for>
</span>
<span style="font: 600 15px/1.4 Manrope, sans-serif; color: #ece6da; text-wrap: pretty">{{t.title}}</span>
</a>
</li>
</sc-for>
</sc-for>
</ul>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["светлая","тёмная"],"default":"светлая","section":"Страница"},"words":{"editor":"enum","options":["аэропорт","как сейчас"],"default":"аэропорт","section":"Статусы"},"$preview":{"width":390,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = (this.props.theme ?? 'светлая') === 'тёмная';
    var air = (this.props.words ?? 'аэропорт') === 'аэропорт';
    var page = dark ? { bg: '#0b0c0e', edge: '#24272d', label: '#9aa0aa' } : { bg: '#f2eee5', edge: '#d8d1c2', label: '#6f695e' };
    var TONE = { ok: '#3ddc84', soon: dark ? '#ffc93c' : '#ff5a36', past: '#a7a196' };
    var TODAY = '2026-10-08';
    var MON = ['ЯНВ', 'ФЕВ', 'МАР', 'АПР', 'МАЙ', 'ИЮН', 'ИЮЛ', 'АВГ', 'СЕН', 'ОКТ', 'НОЯ', 'ДЕК'];
    function cells(text, n, right) {
      var arr = Array.from(String(text).toUpperCase()).slice(0, n);
      var pad = n - arr.length;
      var out = [];
      var i;
      if (right) { for (i = 0; i < pad; i++) out.push(''); }
      arr.forEach(function (ch) { out.push(ch === ' ' ? '' : ch); });
      if (!right) { for (i = 0; i < pad; i++) out.push(''); }
      return out.map(function (ch) { return { ch: ch }; });
    }
    var DEST = [
      { gate: 'A1', code: 'AE 101', name: 'Курс Agentic Engineering', where: 'vladsazonov.com/ai-course', url: 'https://vladsazonov.com/ai-course/', now: 'ОТКРЫТ', air: 'ПОСАДКА', blink: true },
      { gate: 'A2', code: 'MT 202', name: 'Менторство', where: 'GetMentor', url: 'https://getmentor.dev/mentor/vladislav-sazonov-7056', now: 'ЗАПИСЬ', air: 'РЕГИСТРАЦИЯ', blink: false },
      { gate: 'A3', code: 'TG 303', name: 'Telegram-канал', where: '«Вы не просили — я рассказал»', url: 'https://t.me/SazonovMaybeTalks', now: 'LIVE', air: 'В ПОЛЁТЕ', blink: false }
    ];
    var TALKS = [
      { date: '2026-10-16', title: 'Ужесточаем harness, или Сага об агентской предсказуемости', where: 'ГигаКонф', url: 'https://gigaconf.ru/program', slides: null, video: null },
      { date: '2026-09-10', title: 'Молиться на модель или строить harness', where: 'TeamLead Conf Сибирь', url: 'https://teamleadconf.ru/siberia/2026/abstracts/18628', slides: 'https://disk.yandex.ru/i/qI7HiEa-vA2wdA', video: null },
      { date: '2026-07-03', title: 'Круглый стол «MCP vs CLI, harness, агентские платформы»', where: 'Agentic Dev Conf', url: 'https://agenticdevconf.ru/talks/sazonov_vlad', slides: null, video: null },
      { date: '2025-10-21', title: 'Гильдии фронтендеров: что это и нужно ли вообще', where: 'FrontendConf', url: 'https://frontendconf.ru/moscow/2025/abstracts/16364', slides: null, video: null },
      { date: '2025-08-28', title: 'Гильдия: место, где разработчик перестаёт быть одиноким кузнецом', where: 'MoscowJS 67', url: 'http://digital.alfabank.ru/events/moscow_JS_67', slides: null, video: null }
    ];
    function status(t) {
      if (t.date > TODAY) return { label: air ? 'ПО РАСПИСАНИЮ' : 'СКОРО', tone: 'soon', blink: true };
      if (t.date === TODAY) return { label: air ? 'ПОСАДКА' : 'СЕГОДНЯ', tone: 'soon', blink: true };
      if (t.video) return { label: 'ВИДЕО', tone: 'ok', blink: false };
      if (t.slides) return { label: 'СЛАЙДЫ', tone: 'ok', blink: false };
      return { label: air ? 'ВЫЛЕТЕЛ' : 'ПРОШЁЛ', tone: 'past', blink: false };
    }
    var dest = DEST.map(function (d) {
      var label = air ? d.air : d.now;
      return { code: d.code, name: d.name, where: d.where, url: d.url, gateCells: cells(d.gate, 2, false), statusCells: cells(label, Array.from(label).length, false), blink: d.blink };
    });
    var sorted = TALKS.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    var statusN = sorted.reduce(function (n, t) { return Math.max(n, Array.from(status(t).label).length); }, 0);
    var groups = [];
    sorted.forEach(function (t, i) {
      var y = t.date.slice(0, 4);
      var s = status(t);
      var row = {
        title: t.title,
        url: t.video || t.slides || t.url,
        dateCells: cells(t.date.slice(8, 10) + ' ' + MON[Number(t.date.slice(5, 7)) - 1], 6, false),
        destCells: cells(t.where, 20, false),
        statusCells: cells(s.label, statusN, true),
        color: TONE[s.tone],
        blink: s.blink,
        bg: i % 2 ? '#171717' : '#111111'
      };
      var g = groups[groups.length - 1];
      if (!g || g.year !== y) { g = { year: y, talks: [] }; groups.push(g); }
      g.talks.push(row);
    });
    return { page: page, dest: dest, groups: groups, clock: cells('12:35', 5, false) };
  }
}
</script>
</body>
</html>
